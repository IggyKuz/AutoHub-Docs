site_name: AutoHub — Документация ИС СТО
site_description: Документация информационной системы автомастерских и СТО "АвтоХаб"
site_author: IggyKuz

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list

nav:
  - Главная: index.md
  - 1. Общее описание:
      - О проекте и бизнес-контекст: overview/business-case.md
      - Глоссарий и термины: overview/glossary.md
  - 2. Требования к системе:
      - Бизнес-требования (BRD): requirements/business-req.md
      - Пользовательские сценарии (Use Cases): requirements/use-cases.md
  - 3. Проектирование процессов:
      - Процесс приемки и осмотра (BPMN): processes/reception.md
      - Формирование заказа-наряда: processes/work-order.md
  - 4. Архитектура и Данные:
      - Модель данных (ER-диаграмма): architecture/data-model.md
      - Спецификация API (REST): architecture/api-spec.md
