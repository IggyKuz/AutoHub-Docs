site_name: AutoHub — Документация ИС СТО
site_description: Документация информационной системы автомастерских и СТО
site_author: IggyKuz
site_url: https://iggykuz.github.io/AutoHub-Docs/

theme:
  name: material
  language: ru
    
  features:
    - navigation.tabs          # Верхние вкладки (1. Главная, 2. Документация, 3. Задачи)
    - navigation.sections      # Группировка в боковом меню
    #- navigation.expand        # Авто-раскрытие меню
    - navigation.top           # Кнопка наверх
    - navigation.footer        # ← Нижняя панель переходов «Назад / Вперед»

# Настройка Светлой и Тёмной темы + иконки
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему

# Подключаем кастомный CSS для градиента
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details # Раскрывающиеся спойлеры (??? note "Нажмите, чтобы открыть")
  - pymdownx.superfences
# Вкладки с контентом (=== "Название вкладки")
  - pymdownx.tabbed:
      alternate_style: true # Включает современный стиль вкладок (для темы Material)
# Дополнительные полезные расширения для оформления документации:
  - pymdownx.inlinehilite # Подсветка кода внутри текста
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets # Использование инклюдов и фрагментов файлов

nav:
  - 'Главная': index.md
  - 'Документация':
      - '1. Глоссарий': glossary.md
      - '2. Общие сведения':
          - '2.1. Исходные данные': general/input-data.md
          - '2.2. Возможности бизнеса': general/business-opportunities.md
      - '3. Назначение и цели':
          - '3.1. Назначение': goals/purpose.md
          - '3.2. Бизнес-цели': goals/business-goals.md
          - '3.3. Критерии успеха': goals/success-criteria.md
      - '4. Характеристики объекта автоматизации':
          - '4.1. Предмет разработки': automation/scope.md
          - '4.2. Сведения о пользователях': automation/users.md
          - '4.3. Сведения о заинтересованных лицах': automation/stakeholders.md
          - '4.4. Ограничения проекта': automation/constraints.md
      - '5. Описание бизнес-процессов':
          - '5.1. Принятие автомобиля в работу': processes/client-registration.md
          - '5.2. Заказ недостающей запчасти (Релиз 1)': processes/parts-ordering.md
      - '6. Требования к системе':
          - '6.1. Нефункциональные требования': requirements/non-functional.md
          - '6.2. Функциональные требования': requirements/functional.md 
      - '7. Информационная модель':
          - '7.1. Модель предметной области': domain-model/domain.md
          - '7.2. Модель данных': domain-model/data.md
  - 'Задачи':
      - 'I. Задачи MVP (Фаза 1)': tasks/task-1.md
      - 'II. Задачи первого релиза (Фаза 2)': tasks/task-2.md
  - 'Тестирование':
          - 'I. Тесты MVP (Фаза 1)': tasks/testing-mvp.md
          - 'II. Тесты первого релиза (Фаза 2)': tasks/testing-rel1.md
          - 'III. Программа и методика испытаний (ПМИ)': tasks/pmi.md


# Плагины для расширения функционала MkDocs
plugins:
  - search      # Встроенный поиск по документации
  - glightbox:  # Интерактивный просмотр SVG и картинок
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true     # Включает зум
      draggable: true    # Разрешает перетаскивание зазумленной схемы
      skip_classes:
        - skip-lightbox