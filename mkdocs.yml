site_name: AutoHub — Документация ИС СТО
site_description: Документация информационной системы автомастерских и СТО
site_author: IggyKuz

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list

nav:
  - Главная: index.md
  - О проекте:
      - Главная о проекте: about/index.md
      - Цели и задачи: about/goals.md
      - Границы проекта: about/scope.md
  - Бизнес-логика:
      - Главная раздела: business/index.md
      - Роли и пользователи: business/roles.md
      - Бизнес-процессы: business/processes.md
  - Требования:
      - Главная требований: requirements/index.md
      - Функциональные требования: requirements/functional.md
      - Нефункциональные требования: requirements/non-functional.md
  - Архитектура:
      - Обзор архитектуры: architecture/index.md
      - Компоненты системы: architecture/components.md
      - Интеграции: architecture/integrations.md
  - API:
      - Описание API: api/index.md
  - Сокращения: abbreviations.md
